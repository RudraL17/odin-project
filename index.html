<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Library</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Syne & Plus Jakarta Sans (Free, Modern, Clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>


<body data-theme="dark">
  <header>
    <h1>Odin Library</h1>

    <div class="controls">
      <button class="theme-switch" id="themeToggle">🌓 Theme</button>
      <button class="btn btn-primary" id="add-book-button">+AddBook</button>
      <button class="btn btn-outline" id="clearLibraryBtn">Clear Library</button>
    </div>
  </header>
  
  <dialog id="book-dialog" class="modal">
  <h2>Add New Book</h2>

  <form id="book-form">
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" placeholder="Enter book title" required>
    </div>
    <div class="form-group">
      <label for="author">Author:</label>
      <input type="text" id="author" name="author" placeholder="Enter author name" required>
    </div>
    <div class="form-group">
      <label for="pages">Pages:</label>
      <input type="number" id="pages" name="pages" min="1" required>
    </div>
    <label class="checkbox-container form-checkbox">
      <input type="checkbox" id="read" name="read">
      Read Status
    </label>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancel-button">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
  </dialog>
  
  <main class="library-grid" id="container">
    
  </main>
<script src="script.js"></script>
</body>
</html>
